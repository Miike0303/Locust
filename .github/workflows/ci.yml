name: CI

# Pushes to main do not run CI; only version tags (and manual dispatch) do.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `apps/desktop/src-tauri` is a workspace member, so `cargo test --workspace`
      # links against webkit2gtk. Same dependency list the release build uses.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      # The Python integration tests require this normal-target production CLI;
      # missing target/debug/locust is a failure, never a skipped gate.
      - name: Build CLI for Python tests
        env:
          CARGO_TARGET_DIR: target
        run: cargo build -p locust-cli

      - name: Python pipeline tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tools -p test_ja_en_es_pipeline.py

      - name: Python replay-oracle tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/test_qa_replay_oracle.py

      - name: Python RGSS oracle tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/test_qa_rgss_oracle.py

      - name: Offline updater manifest tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/test_updater_manifest.py

      # tauri-build reads tauri.conf.json > frontendDist (apps/desktop/dist),
      # so the frontend must be built before any cargo command touches the
      # desktop crate. This also type-checks the frontend (build runs tsc).
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Frontend unit tests
        working-directory: apps/desktop
        run: npm run test:unit

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  # windows-latest uses the native x64 MSVC toolchain.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Isolated x86 Unicode runtime proof
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/yuris-unicode-runtime/build-proof.ps1 -OutputDirectory tmp/native-japanese-vn/unicode-proof-20261014 -RunTests

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      # Build in target/debug, not an alternate verification target directory.
      - name: Build CLI for Python tests
        env:
          CARGO_TARGET_DIR: target
        run: cargo build -p locust-cli

      - name: Python pipeline tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tools -p test_ja_en_es_pipeline.py

      - name: Python replay-oracle tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/test_qa_replay_oracle.py

      - name: Python RGSS oracle tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/test_qa_rgss_oracle.py

      - name: Offline updater manifest tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/test_updater_manifest.py

      # tauri-build requires apps/desktop/dist before workspace Rust checks.
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Frontend unit tests
        working-directory: apps/desktop
        run: npm run test:unit

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
