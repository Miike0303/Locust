name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Serialize reruns for the same tag; never mutate a release while another run publishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_REF: ${{ github.ref }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version tag, application versions and CHANGELOG
        run: |
          python scripts/release-gate.py prepare --ref "$RELEASE_REF" > release-notes.md
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      # Run CI on this exact commit (workflow_dispatch) before tagging: the CI run
      # started by the tag push itself is still in progress at this point.
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" || { echo "No successful CI run for $RELEASE_SHA" >&2; exit 1; }

      - name: Create or reuse the candidate draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          if ! gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isDraft,isPrerelease > release.json; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --target "$RELEASE_SHA" \
              --title "Project Locust $RELEASE_TAG" --notes-file release-notes.md
            gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isDraft,isPrerelease > release.json
          fi
          python scripts/release-gate.py draft --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --metadata release.json
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (most common)
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          # Windows ARM64 (Surface Pro X, some Copilot+ PCs)
          - platform: 'windows-latest'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'
          # macOS Apple Silicon (M1/M2/M3)
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          # macOS Intel
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          # Linux x64
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.validate.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Project Locust ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # Only the finalizer writes latest.json after every build succeeded.
          includeUpdaterJson: false
          # tauri-action forwards args to tauri build; after -- they reach Cargo.
          args: ${{ matrix.args }} -- --locked

  # The CLI is the apply-only product: `locust apply <game> --url <patch.zip>`
  # needs no desktop install. Ship it on every release so players who only
  # want to APPLY a patch never have to build from source.
  cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            asset: 'locust-x86_64-windows.exe'
            bin: 'locust.exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            asset: 'locust-aarch64-macos'
            bin: 'locust'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            asset: 'locust-x86_64-macos'
            bin: 'locust'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            asset: 'locust-x86_64-linux'
            bin: 'locust'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # `locust-providers` pulls reqwest with default features (native-tls),
      # so the CLI needs OpenSSL headers on Linux even though the CLI's own
      # reqwest is rustls-only.
      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --locked --release -p locust-cli --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Upload CLI to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" --clobber

  # This is the only publisher. Failed/skipped/cancelled matrix jobs leave a draft.
  publish:
    needs: [validate, build, cli]
    if: ${{ needs.validate.result == 'success' && needs.build.result == 'success' && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recheck candidate draft and release notes
        run: |
          python scripts/release-gate.py prepare --ref "$RELEASE_REF" > release-notes.md
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isDraft,isPrerelease > release.json
          python scripts/release-gate.py draft --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --metadata release.json

      - name: Generate and upload strict five-platform manifest
        env:
          # Refuse signatures made with a key other than the shipped public key.
          LOCUST_UPDATER_CONFIG: apps/desktop/src-tauri/tauri.conf.json
        run: |
          bash scripts/generate-updater-manifest.sh "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" latest.json --clobber

      - name: Verify uploaded desktop, signature, CLI and manifest inventory
        run: |
          gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isDraft,isPrerelease,assets,body > release.json
          gh release download "$RELEASE_TAG" --pattern latest.json --output uploaded-latest.json
          python scripts/release-gate.py verify --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" \
            --metadata release.json --manifest uploaded-latest.json --expected-manifest latest.json \
            --notes-file release-notes.md

      - name: Publish verified draft as latest
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
