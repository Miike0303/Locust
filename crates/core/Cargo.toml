[package]
name = "locust-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
rusqlite.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true

walkdir.workspace = true
encoding_rs = "0.8"
chardet = "0.2"
ttf-parser = "0.21"
quick-xml = { version = "0.36", features = ["serialize"] }
# Read-side zip for automatic patch apply (write-side stays in crates/cli).
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"

wasmtime = { version = "25", optional = true }

[dependencies.tokio-util]
version = "0.7"
features = ["rt"]

# The retry/rate-limiter tests use `#[tokio::test(start_paused = true)]`, which
# needs tokio's `test-util`. The workspace tokio is `full`, and `full` does not
# include it — this crate only compiled its tests because another workspace
# member enabled the feature and Cargo unified it. Declared here so
# `cargo test -p locust-core` works on its own.
[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = []
wasm-plugins = ["wasmtime"]
